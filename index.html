<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHILO BAC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b0d1a' stroke='%23e0b862' stroke-width='2'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%23e0b862' font-family='serif'%3E%CF%86%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<canvas id="bg-stars" aria-hidden="true"></canvas>

<header id="topbar">
  <button id="btn-home" class="brand" title="Volver a los capítulos"><span class="phi">φ</span><span>PHILO&nbsp;BAC</span></button>
  <nav id="crumbs" aria-label="Ruta"></nav>
  <div class="spacer"></div>
  <nav class="tabs">
    <button data-go="select" class="tab">Capítulos</button>
    <button data-go="tracker" class="tab">Repaso</button>
    <button data-go="dilemas" class="tab">Dilemas</button>
    <button data-go="disertacion" class="tab">Disertación</button>
    <button data-go="reperes" class="tab">Repères</button>
  </nav>
  <div class="seg" id="lang" role="group" aria-label="Idioma"><button data-l="es">ES</button><button data-l="fr">FR</button></div>
  <div id="xpbox" title="Tu nivel y XP"><span id="lvl">Nv 1</span><div class="xpbar"><i id="xpfill"></i></div><span id="xptxt">0 XP</span></div>
  <button id="btn-settings" class="icon" aria-label="Ajustes" title="Ajustes">⚙</button>
</header>

<main id="app">
  <!-- 4.1 Selector 3D -->
  <section id="view-select" class="view">
    <canvas id="gl"></canvas>
    <div class="hero">
      <h1>Les 17 notions</h1>
      <p>Arrastra para girar · pasa el cursor por un capítulo · clic para entrar</p>
    </div>
    <div id="hover-info" class="hover-info" hidden></div>
    <div id="gl-fallback" hidden></div>
  </section>

  <!-- 4.2 Mapa del capítulo -->
  <section id="view-map" class="view" hidden>
    <aside id="chap-side"></aside>
    <div id="side-resizer" class="resizer" title="Arrastra para cambiar el ancho (doble clic: restablecer)"></div>
    <div id="map-wrap"><svg id="map" role="img" aria-label="Mapa de filósofos y conceptos"></svg>
      <div class="legend"><span class="l infl">influye</span><span class="l opp">se opone</span><span class="l comp">complementa</span><span class="l conc">◆ concepto</span></div>
    </div>
  </section>

  <!-- 4.5 Repaso y tracker -->
  <section id="view-tracker" class="view page" hidden></section>
  <section id="view-dilemas" class="view page" hidden></section>
  <section id="view-disertacion" class="view page" hidden></section>
  <section id="view-reperes" class="view page" hidden></section>
</main>

<!-- Ficha (panel que se expande desde el nodo) -->
<aside id="ficha" class="ficha" hidden></aside>
<div id="ficha-resizer" class="resizer right" title="Arrastra para cambiar el ancho (doble clic: restablecer)" hidden></div>

<!-- Modal genérico: escena / quiz / ajustes -->
<div id="modal" class="modal" hidden>
  <div class="modal-card" id="modal-card" role="dialog" aria-modal="true"></div>
</div>

<div id="toast" class="toast" hidden></div>
<div id="fade" class="fade"></div>

<script src="vendor/three.min.js"></script>
<script src="data/cours.js"></script>
<script src="js/state.js"></script>
<script src="js/i18n.js"></script>
<script src="js/scene-model.js"></script>
<script src="js/skin-notebook.js"></script>
<script src="js/skin-comic.js"></script>
<script src="js/skin-lego.js"></script>
<script src="js/skin-ps2.js"></script>
<script src="js/three-select.js"></script>
<script src="js/map.js"></script>
<script src="js/ui.js"></script>
<script src="js/dilemas.js"></script>
<script src="js/app.js"></script>
</body>
</html>
